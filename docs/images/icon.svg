<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f8a5b"/><stop offset=".55" stop-color="#0f5e4a"/><stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0" stop-color="#5ef0a0"/><stop offset="1" stop-color="#7ee8fa"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5a524"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#gl)"/>
  <!-- progress ring -->
  <circle cx="256" cy="262" r="168" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="26"/>
  <circle cx="256" cy="262" r="168" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"
          stroke-dasharray="1055.6" stroke-dashoffset="330" transform="rotate(-90 256 262)"/>
  <!-- car -->
  <g transform="translate(256 286)">
    <path d="M-74-8 L-44-64 Q-40-70-32-70 H46 Q54-70 58-64 L92-8 Z" fill="#fff"/>
    <rect x="-128" y="-14" width="256" height="66" rx="26" fill="#fff"/>
    <path d="M-60-14 L-38-56 H-6 V-14 Z" fill="#0f5e4a"/>
    <path d="M6-14 V-56 H48 L74-14 Z" fill="#0f5e4a"/>
    <rect x="-120" y="2" width="24" height="12" rx="6" fill="#ffd36b"/>
    <rect x="96" y="2" width="24" height="12" rx="6" fill="#ff8a80"/>
    <circle cx="-70" cy="52" r="30" fill="#0b3b30" stroke="#fff" stroke-width="10"/>
    <circle cx="70" cy="52" r="30" fill="#0b3b30" stroke="#fff" stroke-width="10"/>
    <path d="M4-128 l-22 40 h20 l-12 32 36-46 h-20 l14-26z" fill="#7ee8fa" stroke="#0f5e4a" stroke-width="4" stroke-linejoin="round"/>
  </g>
  <!-- euro coin -->
  <circle cx="392" cy="128" r="66" fill="url(#coin)" stroke="#fff" stroke-width="10"/>
  <text x="392" y="152" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="76" fill="#6b3d00">€</text>
</svg>
