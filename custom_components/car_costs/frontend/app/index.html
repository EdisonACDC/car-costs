<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Costi Auto</title>
  <meta name="description" content="Car Costs: what your car really costs, compared with the old one">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#0c3b2e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#d7f5e6" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Costi Auto">
  <link rel="apple-touch-startup-image" href="splash/splash-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="apple-touch-startup-image" href="splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="splash" aria-hidden="true"><div class="logo">🚙</div><b>Costi Auto</b></div>
  <div id="ptr" class="glass" aria-hidden="true"><span>↻</span></div>
  <main id="app" class="app"></main>
  <nav id="tabs" class="tabs glass" aria-label="Menu" hidden>
    <button data-tab="overview" class="on"><span aria-hidden="true">◉</span><i data-l="nav_overview"></i></button>
    <button data-tab="log"><span aria-hidden="true">☰</span><i data-l="nav_log"></i></button>
    <button id="fab" class="fab" aria-label="＋">＋</button>
    <button data-tab="charts"><span aria-hidden="true">▤</span><i data-l="nav_charts"></i></button>
    <button data-tab="settings"><span aria-hidden="true">⚙︎</span><i data-l="nav_settings"></i></button>
  </nav>
  <div id="layer"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Costi Auto needs JavaScript.</noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
