<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Costi Auto</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#1b5e20">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Costi Auto">
  <style>
    :root {
      --primary-color: #2e7d32; --text-primary-color: #fff;
      --primary-text-color: #1c1c1e; --secondary-text-color: #6e6e73;
      --card-background-color: #fff; --ha-card-background: #fff;
      --secondary-background-color: #f2f2f7; --divider-color: #e5e5ea;
      --success-color: #2e7d32; --error-color: #d32f2f;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --primary-color: #66bb6a; --text-primary-color: #0b1a0c;
        --primary-text-color: #f2f2f7; --secondary-text-color: #a1a1a6;
        --card-background-color: #1c1c1e; --ha-card-background: #1c1c1e;
        --secondary-background-color: #2c2c2e; --divider-color: #3a3a3c;
        --success-color: #66bb6a; --error-color: #ef5350;
      }
      body { background: #000; }
    }
    html, body { margin: 0; background: #f2f2f7; color: var(--primary-text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto;
      padding: calc(env(safe-area-inset-top) + 10px) 10px calc(env(safe-area-inset-bottom) + 16px); }
    ha-card { display: block; background: var(--card-background-color); border-radius: 18px; overflow: hidden; }
    ha-icon { display: inline-flex; align-items: center; justify-content: center; line-height: 1;
      font-size: calc(var(--mdc-icon-size, 24px) * .85); width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); }
    .status { text-align: center; color: var(--secondary-text-color); padding: 40px 16px; }
    .status button { margin-top: 14px; font: inherit; border: 0; border-radius: 999px; padding: 10px 18px;
      background: var(--primary-color); color: var(--text-primary-color); }
    #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translateX(-50%);
      background: #323232; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: .9em; display: none; max-width: 90vw; }
    .foot { text-align: center; font-size: .75em; color: var(--secondary-text-color); margin-top: 12px; }
    .foot a { color: inherit; }
  </style>
</head>
<body>
  <main id="main"><div class="status">…</div></main>
  <div id="toast"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
