[project]
name = "car-costs"
version = "0.3.0b6"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["custom_components/car_costs"]
