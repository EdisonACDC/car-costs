name: Release asset

# Every release (pre-releases too) gets car_costs.zip: the content of custom_components/car_costs,
# which HACS / the Marketplace downloads (hacs.json: zip_release, filename). GitHub counts the
# downloads of this asset.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Attach car_costs.zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build car_costs.zip
        run: |
          cd custom_components/car_costs
          zip -r -X "$GITHUB_WORKSPACE/car_costs.zip" . -x "__pycache__/*" "*/__pycache__/*" "*.pyc"
          unzip -l "$GITHUB_WORKSPACE/car_costs.zip" | grep -q " manifest.json$"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" car_costs.zip --clobber --repo "$GITHUB_REPOSITORY"
